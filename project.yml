name: Vara
options:
  bundleIdPrefix: dk.56n
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

# Map the two build configurations explicitly so the Release override below
# (hardened runtime) attaches to the right config. Debug stays relaxed for the
# daily local build under the "Apple Development" cert; Release is notarizable.
configs:
  Debug: debug
  Release: release

packages:
  VaraCore:
    path: .
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: 3B7KHK6C9K
    CODE_SIGNING_REQUIRED: "YES"
    CODE_SIGNING_ALLOWED: "YES"
    ENABLE_HARDENED_RUNTIME: "NO"
    DEAD_CODE_STRIPPING: "YES"
  configs:
    # Notarization requires the hardened runtime, so Release flips it on. Debug
    # leaves it off (above) so the daily build keeps working under the existing
    # "Apple Development" cert without any extra entitlement re-signing.
    Release:
      ENABLE_HARDENED_RUNTIME: "YES"
      DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
      COPY_PHASE_STRIP: "NO"

targets:
  Vara:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "Resources/**"
      - path: App/Resources/Fonts
        buildPhase: resources
        type: folder
      - path: App/Resources/AppIcon.icns
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Vara
        CFBundleDisplayName: Vara
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "2"
        LSUIElement: false
        LSMinimumSystemVersion: "14.0"
        ATSApplicationFontsPath: Fonts
        CFBundleIconFile: AppIcon
        NSHumanReadableCopyright: "© 2026 Brokk og Sindre ApS · brokk-sindre.dk"
        NSMicrophoneUsageDescription: >-
          Vara listens to your voice to turn speech into text. Audio is
          transcribed by the engine you choose in Settings.
        # Allow plaintext HTTP to local-network hosts (.local, *.local,
        # private/link-local addresses, localhost) so the LOCAL-PRIVATE chain
        # can reach a DGX/LAN LLM endpoint such as http://spark.local:11434.
        # macOS App Transport Security otherwise blocks plaintext to named
        # hosts, which would silently fail the local-LLM chain and fall back to
        # the raw transcript. NSAllowsLocalNetworking does NOT weaken security
        # for public hosts (unlike NSAllowsArbitraryLoads, which we never set).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Sparkle auto-update. SUPublicEDKey is the EdDSA public key from
        # `generate_keys` (private key lives in the login keychain, never in the
        # repo). SUFeedURL serves the appcast over HTTPS from vara.dk.
        SUFeedURL: https://vara.dk/appcast.xml
        SUPublicEDKey: gkGG0RaoroAzfFTpL8TJrIsYlU6K++AnJx0JxJrvOrU=
        SUEnableAutomaticChecks: true
    entitlements:
      path: App/Vara.entitlements
      properties:
        com.apple.security.device.audio-input: true
        # Hardened-runtime relaxations required ONLY because Vara spawns a
        # user-provided Python (Hviske) as a subprocess. disable-library-validation
        # lets that python load unsigned third-party dylibs (torch/numpy/soundfile);
        # allow-dyld-environment-variables lets the backend set HF_HOME /
        # PYTORCH_ENABLE_MPS_FALLBACK in the child environment (runProcess merges
        # the parent env). Vara itself is pure Swift, so we do NOT enable
        # allow-unsigned-executable-memory / allow-jit.
        com.apple.security.cs.disable-library-validation: true
        com.apple.security.cs.allow-dyld-environment-variables: true
    dependencies:
      - package: VaraCore
        product: VaraCore
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.56n.vara
        PRODUCT_NAME: Vara
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: App/Info.plist
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "2"

  # Unit tests for App-layer pure logic that can't move to VaraCore (the settings
  # enums are localized via App's string catalog). Hosted by the Vara app so it
  # can @testable import Vara. Logic-only — no UI interaction.
  VaraAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/VaraAppTests
    dependencies:
      - target: Vara
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.56n.vara.apptests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  Vara:
    build:
      targets:
        Vara: all
        VaraAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VaraAppTests
    archive:
      config: Release
