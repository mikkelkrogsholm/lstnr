name: Lstnr
options:
  bundleIdPrefix: dk.56n
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  LstnrCore:
    path: .

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: 3B7KHK6C9K
    CODE_SIGNING_REQUIRED: "YES"
    CODE_SIGNING_ALLOWED: "YES"
    ENABLE_HARDENED_RUNTIME: "NO"
    DEAD_CODE_STRIPPING: "YES"

targets:
  Lstnr:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "Resources/**"
      - path: App/Resources/Fonts
        buildPhase: resources
        type: folder
      - path: App/Resources/AppIcon.icns
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Vara
        CFBundleDisplayName: Vara
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: false
        LSMinimumSystemVersion: "14.0"
        ATSApplicationFontsPath: Fonts
        CFBundleIconFile: AppIcon
        NSHumanReadableCopyright: "© 2026 Brokk og Sindre ApS · brokk-sindre.dk"
        NSMicrophoneUsageDescription: >-
          Vara listens to your voice to turn speech into text. Audio is
          transcribed by the engine you choose in Settings.
        # Allow plaintext HTTP to local-network hosts (.local, *.local,
        # private/link-local addresses, localhost) so the LOCAL-PRIVATE chain
        # can reach a DGX/LAN LLM endpoint such as http://spark.local:11434.
        # macOS App Transport Security otherwise blocks plaintext to named
        # hosts, which would silently fail the local-LLM chain and fall back to
        # the raw transcript. NSAllowsLocalNetworking does NOT weaken security
        # for public hosts (unlike NSAllowsArbitraryLoads, which we never set).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: App/Lstnr.entitlements
      properties:
        com.apple.security.device.audio-input: true
    dependencies:
      - package: LstnrCore
        product: LstnrCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.56n.lstnr
        PRODUCT_NAME: Vara
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: App/Info.plist
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"

schemes:
  Lstnr:
    build:
      targets:
        Lstnr: all
    run:
      config: Debug
    archive:
      config: Release
